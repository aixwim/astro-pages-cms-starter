media:
  - name: images
    label: Images
    input: public/images
    output: /images
    rename: safe
    extensions: [webp, png, jpg, jpeg, svg]
    categories: [image]
    commit:
      templates:
        create: 'media: add {filename}'
        update: 'media: update {filename}'
        delete: 'media: remove {filename}'
        rename: 'media: rename {oldFilename} -> {newFilename}'
  - name: drive
    label: Google Drive Sync
    input: public/drive
    output: /drive
    rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: 'content: create {filename}'
      update: 'content: update {filename}'
      delete: 'content: remove {filename}'

content:
  - name: site
    label: Site Settings
    type: file
    path: src/data/site.json
    format: json
    operations:
      delete: false
    fields:
      - { name: name, label: Brand name, type: string, required: true }
      - { name: tagline, label: Tagline, type: string, required: true }
      - { name: description, label: Description, type: text, required: true }
      - { name: email, label: Contact email, type: string, required: true }
      - {
          name: driveUrl,
          label: Google Drive URL,
          type: string,
          required: true,
        }
      - {
          name: googleSearchConsoleVerification,
          label: Google Search Console verification token,
          type: string,
          description: Paste only the content value from the HTML verification tag. Leave empty until verified.,
        }
      - {
          name: bingWebmasterVerification,
          label: Bing Webmaster verification token,
          type: string,
          description: Optional verification token. Leave empty if unused.,
        }
      - {
          name: googleAnalyticsId,
          label: Google Analytics 4 measurement ID,
          type: string,
          pattern: '^$|^G-[A-Z0-9]+$',
          description: Optional. Example G-XXXXXXXXXX. Tracking stays disabled when empty.,
        }
  - name: posts
    label: Insights
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename: '{year}-{month}-{day}-{primary}.md'
    view:
      primary: title
      fields: [title, topic, category, publishedAt, featured]
      search: [title, description, category, topic, tags]
      sort: [publishedAt, title]
      default:
        sort: publishedAt
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Summary, type: text, required: true }
      - { name: publishedAt, label: Published date, type: date, required: true }
      - { name: author, label: Author, type: string, default: Redaksi Aixwim }
      - {
          name: category,
          label: Category,
          type: select,
          options:
            [
              Teknologi,
              Literasi Digital,
              Keamanan,
              Privasi,
              Produktivitas,
              Kerja Modern,
              Pembelajaran,
              Kreativitas,
            ],
          default: Teknologi,
        }
      - {
          name: topic,
          label: Main topic,
          type: select,
          options: [ai-teknologi, karier-produktivitas, belajar-keterampilan],
          default: ai-teknologi,
        }
      - { name: tags, label: Tags, type: string, list: true }
      - name: image
        label: SEO image
        type: image
        required: true
        options:
          media: images
          path: posts
          extensions: [webp, png, jpg, jpeg]
      - { name: imageAlt, label: Image alt text, type: string, required: true }
      - name: seoTitle
        label: SEO title
        type: string
        description: 'Optional search title. Keep it clear and specific; do not stuff keywords.'
        pattern:
          regex: '^.{20,65}$'
          message: 'Use 20–65 characters when SEO title is provided.'
      - name: seoDescription
        label: SEO meta description
        type: text
        description: 'Optional search snippet. Write a unique useful summary, normally 70–170 characters.'
        pattern:
          regex: '^.{70,170}$'
          message: 'Use 70–170 characters when SEO description is provided.'
      - name: focusKeyword
        label: Focus keyword
        type: string
        description: 'Editorial planning only. Google does not use a meta keywords tag.'
      - name: canonicalUrl
        label: Canonical URL override
        type: string
        description: 'Leave empty unless this page intentionally canonicalizes to another URL.'
      - name: noindex
        label: Hide from search indexing
        type: boolean
        default: false
        description: 'Enable only for drafts or pages that should not appear in search results.'
      - { name: draft, label: Draft, type: boolean, default: false }
      - { name: updatedAt, label: Updated date, type: date }
      - { name: featured, label: Featured, type: boolean, default: false }
      - { name: body, label: Content, type: rich-text }
    operations:
      create: true
      rename: true
      delete: true
    actions:
      - name: validate-posts
        label: Validate all posts
        scope: collection
        workflow: pages-cms-validate.yml
        ref: current
        confirm:
          title: Validate all posts?
          message: Run the content, taxonomy, build, and link checks.
          button: Run validation
actions:
  - name: deploy-site
    label: Deploy site
    workflow: deploy-pages.yml
    ref: current
    cancelable: true
    confirm:
      title: Deploy site now?
      message: Run the production build and publish the current branch.
      button: Deploy
