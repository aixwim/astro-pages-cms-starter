name: Lighthouse
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Build audit target
        run: npm run build
        env:
          LIGHTHOUSE_LOCAL: 'true'
          SITE_URL: http://localhost
      - name: Audit performance and quality
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.json
