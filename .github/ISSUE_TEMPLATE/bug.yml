name: Bug report
description: Report a reproducible problem
title: 'bug: '
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      { label: Problem, description: What happened and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      {
        label: Reproduction,
        description: Provide minimal steps and relevant URLs.,
      }
    validations: { required: true }
